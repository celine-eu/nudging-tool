version: "3"

tasks:
  setup:
    cmds:
      - uv sync

  run:
    desc: "Run development server"
    cmds:
      - CELINE_ENV=${CELINE_ENV:-dev} .venv/bin/uvicorn celine.nudging.main:create_app --reload --host 0.0.0.0 --port 8016

  debug:
    desc: "Run development server with debugger"
    cmds:
      - CELINE_ENV=${CELINE_ENV:-dev} LOG_LEVEL=DEBUG DEBUG_ATTACH=nowait DEBUG_PORT=48016 .venv/bin/uvicorn celine.nudging.main:create_app --reload --host 0.0.0.0 --port 8016

  test:
    desc: Run tests
    cmds:
      - uv run pytest -- {{.CLI_ARGS}}

  test:real-tokens:
    desc: "Run the opt-in real-token layer against the local Keycloak (ADR-0004)"
    cmds:
      - NUDGING_REAL_TOKENS=1 uv run --no-sync pytest tests/integration -rs {{.CLI_ARGS}}

  release:
    cmds:
      - uv run semantic-release -v version --no-vcs-release
      - git push
      - git push --tags

  alembic:migrate:
    desc: "Run migrations"
    cmds:
      # The prepared virtualenv, not `uv run`: that re-syncs the lockfile and
      # would replace an editable celine-sdk link with the locked wheel.
      - .venv/bin/alembic upgrade head

  alembic:sync-model:
    desc: "Generate a new alembic migration. Usage: task alembic:sync-model -- 'short description'"
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  alembic:reset:
    desc: "Reset DB schema"
    cmds:
      - uv run alembic downgrade base

  seed:
    desc: "Seed nudging rules"
    cmds:
      - .venv/bin/nudging-cli seed apply ./seed --client-id celine-cli --client-secret celine-cli
