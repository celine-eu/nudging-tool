volumes:
  pgdata:

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8016:8016"
    environment:
      # No development default: unset is hardened (celine.sdk.posture). Set
      # CELINE_ENV=dev in the shell or in .env to run with the local defaults.
      CELINE_ENV: ${CELINE_ENV:-}
      SEED_DIR: /app/seed
      ORCHESTRATOR_URL: http://localhost:8016/nudging
      # VAPID keys — generate with: nudging-cli vapid generate
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dev@celine.localhost}
      # Dev SMTP sink: mailpit from the celine-dev stack (UI http://localhost:8025)
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      EMAIL_FROM: ${EMAIL_FROM:-nudging@celine.localhost}
      # Template language for users without a preference (same default as .env.example)
      DEFAULT_LANG: ${DEFAULT_LANG:-it}
    volumes:
      - ./seed:/app/seed
      - ./.env:/app/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8016/health'').read()"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["alembic", "upgrade", "head"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
